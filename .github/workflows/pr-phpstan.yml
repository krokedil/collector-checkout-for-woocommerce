name: PHPStan

on:
    pull_request:
        types: [opened, synchronize, reopened]
        branches: [develop, master]
        paths:
            - "**.php"
            - "phpstan.neon"
            - "phpstan-baseline.neon"
            - "composer.json"
            - "composer.lock"
            - "composer-dependencies.json"
            - "composer-dependencies.lock"

permissions:
    contents: read

concurrency:
    group: pr-phpstan-check-${{ github.ref }}
    cancel-in-progress: true

jobs:
    phpstan:
        name: PHPStan static analysis (PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # 7.4 is the floor pinned in composer's platform config and php requirement,
                # 8.3 is a common production version and 8.5 the latest.
                php: ["7.4", "8.3", "8.5"]
        steps:
            - name: Checkout repository
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

            - name: Setup PHP
              uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  tools: composer:v2

            # --no-scripts keeps the job to installing what PHPStan needs. wpify/scoper is a
            # composer-plugin rather than a script, so it still populates dependencies/.
            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-progress --optimize-autoloader --no-scripts

            # An empty dependencies/ would surface as thousands of unknown-class errors
            # rather than an honest failure, so fail loudly here instead.
            - name: Verify scoped dependencies were generated
              run: test -f dependencies/autoload.php || { echo "::error::dependencies/ was not generated by wpify/scoper"; exit 1; }

            - name: Run PHPStan
              run: composer phpstan
